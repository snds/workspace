[package]
name = "omni-fonts"
version = "0.1.0"
edition = "2021"
description = "Local font server for the Omni design tool"
authors = []

[[bin]]
name = "omni-fonts"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",   features = ["full"] }
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
fontdb      = "0.22"
clap        = { version = "4",   features = ["derive"] }

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
