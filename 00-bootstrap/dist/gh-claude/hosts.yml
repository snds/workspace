# Claude's gh config for personal repos (credentials stay scoped per repo). Names the snds account;
# the token stays in the OS keyring (gh auth login as snds once per machine). Centric repos use the
# device-default gh instead (env -u GH_CONFIG_DIR, or lift_env for vetted scripts).
# No secrets in this file.
github.com:
    users:
        snds:
    git_protocol: ssh
    user: snds
