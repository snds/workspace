name: workspace-integrity

# The write-quality / continuity / anti-zombie gates that let ANY agent write safely:
#  - validate-workspace.py: archive provenance + memory-index coverage
#  - validate-integrity.py: name==dir, cross-link continuity (no dangling wikilinks),
#    no superseded-but-live files, no unfilled scaffold/stub tokens, quality smells
#  - vault-health.py: dangling typed edges, orphan notes, stale claims
#  - workspace-harness.py: can an agent REACH each skill/entry, and what does the
#    worst-case traversal cost (budget ceilings are a regression gate)
# See 01-frameworks/08-workspace-contribution-framework.md → "Write-quality gates".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "_archive/**"
      - "06-context/memory/**"
      - "09-tools/validate-workspace.py"
      - "09-tools/validate-integrity.py"
      - "09-tools/test-validators.py"
      - "09-tools/evaluate-skill-routing.py"
      - "09-tools/skill-loadset.py"
      - "09-tools/close-out-dispatch.py"
      - "09-tools/check-secrets.py"
      - "09-tools/validate-layer0-schema.py"
      - "09-tools/session-status.py"
      - "09-tools/prompt_route.py"
      - "09-tools/vault-health.py"
      - "09-tools/workspace-harness.py"
      - "09-tools/evaluate-surface-trajectories.py"
      - "09-tools/validate-evidence-grades.py"
      - "09-tools/nightly.py"
      - "09-tools/artifact-find.py"
      - "09-tools/figma-bind-probe.py"
      - "06-context/artifact-registry.md"
      - "ruff.toml"
      - "02-shared-references/surface-trajectory-cases.jsonl"
      - "02-shared-references/skill-routing-cases.jsonl"
      - "02-shared-references/trigger-routes.json"
      - "02-shared-references/knowledge-hints.json"
      - "02-shared-references/schemas/**"
      - "03-skills/skills.registry.json"
      - "09-tools/profile_resolve.py"
      - "02-shared-references/devices.json"
      - "02-shared-references/delivery-playbooks/*.json"
      - "00-bootstrap/beacon-enroll.sh"
      - "09-tools/fixtures/profile_resolve/**"
  pull_request:
    paths:
      - "**/*.md"
      - "_archive/**"
      - "06-context/memory/**"
      - "09-tools/validate-workspace.py"
      - "09-tools/validate-integrity.py"
      - "09-tools/test-validators.py"
      - "09-tools/evaluate-skill-routing.py"
      - "09-tools/skill-loadset.py"
      - "09-tools/close-out-dispatch.py"
      - "09-tools/check-secrets.py"
      - "09-tools/validate-layer0-schema.py"
      - "09-tools/session-status.py"
      - "09-tools/prompt_route.py"
      - "09-tools/vault-health.py"
      - "09-tools/workspace-harness.py"
      - "09-tools/evaluate-surface-trajectories.py"
      - "09-tools/validate-evidence-grades.py"
      - "09-tools/nightly.py"
      - "09-tools/artifact-find.py"
      - "09-tools/figma-bind-probe.py"
      - "06-context/artifact-registry.md"
      - "ruff.toml"
      - "02-shared-references/surface-trajectory-cases.jsonl"
      - "02-shared-references/skill-routing-cases.jsonl"
      - "02-shared-references/trigger-routes.json"
      - "02-shared-references/knowledge-hints.json"
      - "02-shared-references/schemas/**"
      - "03-skills/skills.registry.json"
      - "09-tools/profile_resolve.py"
      - "02-shared-references/devices.json"
      - "02-shared-references/delivery-playbooks/*.json"
      - "00-bootstrap/beacon-enroll.sh"
      - "09-tools/fixtures/profile_resolve/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint the automation layer (CI-only; never a vault runtime dep)
        uses: astral-sh/ruff-action@v3
        with:
          args: check
      - name: Archive provenance + memory index
        run: python3 09-tools/validate-workspace.py
      - name: Write-quality + cross-link continuity + anti-zombie
        run: python3 09-tools/validate-integrity.py
      - name: Adversarial skill-routing corpus
        run: python3 09-tools/evaluate-skill-routing.py --check
      - name: Skill loadset smoke
        run: python3 09-tools/skill-loadset.py --self-test
      - name: Command-hub L3 table
        run: python3 09-tools/close-out-dispatch.py --check
      - name: Layer 0 JSON schema
        run: python3 09-tools/validate-layer0-schema.py --check
      - name: Session-start ritual card
        run: python3 09-tools/session-status.py --check
      - name: Secret shape scan
        run: python3 09-tools/check-secrets.py
      - name: Epistemic graph hygiene (dangling typed edges, orphans, stale claims)
        run: python3 09-tools/vault-health.py
      - name: Harness self-test (the detectors must be able to fail)
        run: python3 09-tools/workspace-harness.py --self-test
      - name: Reachability, connection solidity, traversal token budget
        run: python3 09-tools/workspace-harness.py --connections --tokens
      - name: Per-surface trajectories (every surface delivers the same context)
        run: python3 09-tools/evaluate-surface-trajectories.py --self-test
      - name: Surface trajectory corpus + one-matcher guard
        run: python3 09-tools/evaluate-surface-trajectories.py --check
      - name: Evidence grades (a VERIFIED stamp must name what verified it)
        run: python3 09-tools/validate-evidence-grades.py
      - name: Evidence-grade lint self-test
        run: python3 09-tools/validate-evidence-grades.py --self-test
      - name: Nightly entrypoint is wired correctly (plan only, runs nothing)
        run: python3 09-tools/nightly.py --dry-run
      - name: Artifact registry stays queryable (an index you ingest is a bug)
        run: python3 09-tools/artifact-find.py --check
      - name: Artifact retrieval self-test
        run: python3 09-tools/artifact-find.py --self-test
      - name: Figma construction gate (the probe must refuse planted violations)
        run: python3 09-tools/figma-bind-probe.py --self-test
      - name: Figma probe fixtures (clean passes, violations fail, empty is not a pass)
        run: |
          python3 09-tools/figma-bind-probe.py --capture 09-tools/fixtures/figma-capture.clean.json
          ! python3 09-tools/figma-bind-probe.py --capture 09-tools/fixtures/figma-capture.violations.json
      - name: Resolver self-test
        run: python3 09-tools/profile_resolve.py --self-test
      - name: Declared tables valid
        run: python3 09-tools/profile_resolve.py validate-tables
      - name: Negative fixtures (validators must refuse planted defects)
        run: python3 09-tools/test-validators.py
