name: validator-fixtures

# Negative fixtures: each detector must refuse a planted defect.
# The live-tree validators only see a healthy checkout; this job is the teeth.
# See 09-tools/test-validators.py and AGENTS.md → "Write-quality gates".

on:
  push:
    branches: [main]
    paths:
      - "09-tools/validate-*.py"
      - "09-tools/vault-health.py"
      - "09-tools/test-validators.py"
      - "09-tools/evaluate-skill-routing.py"
      - "09-tools/skill-loadset.py"
      - "09-tools/close-out-dispatch.py"
      - "09-tools/check-secrets.py"
      - "09-tools/validate-layer0-schema.py"
      - "09-tools/prompt_route.py"
      - "02-shared-references/skill-routing-cases.jsonl"
      - "02-shared-references/schemas/**"
      - "03-skills/visual-prove-engine/**"
      - "03-skills/play-prove/**"
      - ".github/workflows/validator-fixtures.yml"
      - ".claude/hooks/dispatcher.py"
      - "00-bootstrap/setup/setup.py"
      - "09-tools/nightly.py"
      - "09-tools/fixtures/nightly/**"
      - "09-tools/fixtures/employer_substance/**"
      - "02-shared-references/employer-substance-baseline.json"
      - "09-tools/intent-run.py"
      - "09-tools/fixtures/intent_run/**"
      - "09-tools/ws_hook.py"
      - "00-bootstrap/doctor/render_shims.py"
      - "00-bootstrap/dist/**"
      - "02-shared-references/surfaces.json"
      - "02-shared-references/probes/**"
      - ".claude/settings.json"
      - ".cursor/hooks.json"
      - ".cursor/hooks/**"
      - "00-bootstrap/doctor/**"
      - "09-tools/build-local-skill-plugin.py"
      - "09-tools/fixtures/installer/**"
      - "09-tools/profile_resolve.py"
      - "02-shared-references/devices.json"
      - "02-shared-references/delivery-playbooks/*.json"
      - "00-bootstrap/beacon-enroll.sh"
      - "09-tools/fixtures/profile_resolve/**"
  pull_request:
    paths:
      - "09-tools/validate-*.py"
      - "09-tools/vault-health.py"
      - "09-tools/test-validators.py"
      - "09-tools/evaluate-skill-routing.py"
      - "09-tools/skill-loadset.py"
      - "09-tools/close-out-dispatch.py"
      - "09-tools/check-secrets.py"
      - "09-tools/validate-layer0-schema.py"
      - "09-tools/prompt_route.py"
      - "02-shared-references/skill-routing-cases.jsonl"
      - "02-shared-references/schemas/**"
      - "03-skills/visual-prove-engine/**"
      - "03-skills/play-prove/**"
      - ".github/workflows/validator-fixtures.yml"
      - ".claude/hooks/dispatcher.py"
      - "00-bootstrap/setup/setup.py"
      - "09-tools/nightly.py"
      - "09-tools/fixtures/nightly/**"
      - "09-tools/fixtures/employer_substance/**"
      - "02-shared-references/employer-substance-baseline.json"
      - "09-tools/intent-run.py"
      - "09-tools/fixtures/intent_run/**"
      - "09-tools/ws_hook.py"
      - "00-bootstrap/doctor/render_shims.py"
      - "00-bootstrap/dist/**"
      - "02-shared-references/surfaces.json"
      - "02-shared-references/probes/**"
      - ".claude/settings.json"
      - ".cursor/hooks.json"
      - ".cursor/hooks/**"
      - "00-bootstrap/doctor/**"
      - "09-tools/build-local-skill-plugin.py"
      - "09-tools/fixtures/installer/**"
      - "09-tools/profile_resolve.py"
      - "02-shared-references/devices.json"
      - "02-shared-references/delivery-playbooks/*.json"
      - "00-bootstrap/beacon-enroll.sh"
      - "09-tools/fixtures/profile_resolve/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # session-status self-test diffs against the 2ff02e7 card oracle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Negative fixtures (validators must refuse planted defects)
        run: python3 09-tools/test-validators.py
      - name: Dispatcher self-test
        run: python3 .claude/hooks/dispatcher.py --self-test
      - name: Nightly sequencer self-test (fixpoint, lane, X1 replay, timed SessionEnd)
        run: python3 09-tools/nightly.py --self-test
      - name: session-status self-test
        run: python3 09-tools/session-status.py --self-test
      - name: check-secrets self-test
        run: python3 09-tools/check-secrets.py --self-test

  # Same contract for the visual detectors: every planted visual defect must be
  # caught and every clean/noise-only variant must stay quiet, or the engine's
  # verdicts cannot be trusted. See 03-skills/visual-prove-engine/SKILL.md.
  # play-prove is exercised inside `vqa calibrate` (sibling CLI, altitude G).
  vqa-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install measurement substrate
        run: python3 -m pip install numpy Pillow
      - name: Visual prove engine calibration (planted defects, zero miss / zero false-fire)
        run: python3 03-skills/visual-prove-engine/vqa.py calibrate
